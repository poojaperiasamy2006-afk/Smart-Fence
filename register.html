<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartFence - Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="auth-body">

    <div class="auth-wrapper">

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                🌲
            </div>

            <!-- Title -->
            <h1>SmartFence</h1>

            <p class="auth-subtitle">
                Forest Monitoring & Alert System
            </p>

            <div class="auth-divider"></div>

            <!-- Register Heading -->
            <h2>
                Create Account 🌿
            </h2>

            <p class="auth-description">
                Create your Forest Guardian account.
            </p>

            <!-- Error -->
            {% if error %}
            <div class="auth-error">
                ⚠️ {{ error }}
            </div>
            {% endif %}

            <!-- Register Form -->
            <form method="POST"
                  action="{{ url_for('register') }}">

                <!-- Name -->
                <div class="auth-input-group">

                    <label for="name">
                        👤 Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >

                </div>

                <!-- Email -->
                <div class="auth-input-group">

                    <label for="email">
                        📧 Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

                <!-- Password -->
                <div class="auth-input-group">

                    <label for="password">
                        🔒 Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Minimum 6 characters"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <!-- Confirm Password -->
                <div class="auth-input-group">

                    <label for="confirm_password">
                        🔐 Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Re-enter password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <!-- Register Button -->
                <button
                    type="submit"
                    class="auth-button">

                    🌲 Create Account

                </button>

            </form>

            <!-- Login Link -->
            <p class="auth-switch">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Login
                </a>

            </p>

            <!-- Footer -->
            <div class="auth-footer">

                🛡️ Secure Forest Monitoring Platform

            </div>

        </div>

    </div>

</body>

</html>
